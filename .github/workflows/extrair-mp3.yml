name: Extrair audio MP3 do YouTube

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extrair-mp3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar FFmpeg e yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user --upgrade yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Baixar e converter audio para MP3
        shell: bash
        run: |
          mkdir -p audios
          yt-dlp \
            --no-playlist \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 192K \
            --output "audios/%(title).150B [%(id)s].%(ext)s" \
            "https://youtu.be/gYNYZVCrwHo"
          test -n "$(find audios -maxdepth 1 -type f -name '*.mp3' -print -quit)"

      - name: Disponibilizar MP3 para download
        uses: actions/upload-artifact@v4
        with:
          name: audio-mp3-gYNYZVCrwHo
          path: audios/*.mp3
          if-no-files-found: error
          retention-days: 7
