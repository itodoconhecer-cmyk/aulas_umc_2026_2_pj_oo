name: Extrair audio MP3 do YouTube

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extrair-mp3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar yt-dlp e conferir FFmpeg
        shell: bash
        run: |
          python -m pip install --upgrade pip yt-dlp
          ffmpeg -version | head -n 1
          yt-dlp --version

      - name: Baixar e converter audio para MP3
        shell: bash
        run: |
          mkdir -p audios
          yt-dlp \
            --no-playlist \
            --retries 3 \
            --fragment-retries 3 \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 192K \
            --output "audios/%(title).150B [%(id)s].%(ext)s" \
            "https://youtu.be/gYNYZVCrwHo"
          test -n "$(find audios -maxdepth 1 -type f -name '*.mp3' -print -quit)"

      - name: Disponibilizar MP3 para download
        uses: actions/upload-artifact@v4
        with:
          name: audio-mp3-gYNYZVCrwHo
          path: audios/*.mp3
          if-no-files-found: error
          retention-days: 7
